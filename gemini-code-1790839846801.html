<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Object Finder Mobile</title>
<style>
  :root {
    --bg: #10151c;
    --panel: #1a212b;
    --ink: #eef2f6;
    --dim: #8d99a8;
    --seek: #ffc233;
    --found: #3ee6b5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  
  #app { display: flex; flex-direction: column; height: 100%; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding: 12px; display: flex; gap: 8px; align-items: center; background: var(--panel); }
  header h1 { font-size: 16px; font-weight: 700; flex: 1; }
  select, button { font: inherit; color: var(--ink); background: #2a3442; border: none; border-radius: 8px; padding: 8px 12px; }
  select { flex: 1.5; outline: none; }
  button { cursor: pointer; font-weight: 600; }
  button.go { background: var(--seek); color: #1b1500; }
  
  #stage { position: relative; flex: 1; margin: 10px; border-radius: 12px; overflow: hidden; background: #000; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  
  /* Front Camera Mirror Effect */
  video.mirror, canvas.mirror { transform: scaleX(-1); }

  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; color: var(--dim); }
  #status { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 10px 14px; border-radius: 10px; background: rgba(16,21,28,0.85); backdrop-filter: blur(4px); font-size: 14px; border-left: 4px solid var(--seek); }
  #status.found { border-left-color: var(--found); }
  #status b { display: block; font-size: 16px; margin-bottom: 2px; }
  
  footer { padding: 10px 14px; display: flex; gap: 10px; align-items: center; background: var(--panel); font-size: 13px; }
  footer label { display: flex; gap: 6px; align-items: center; flex: 1; color: var(--dim); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Object Finder</h1>
    <select id="target" aria-label="Target Object"></select>
    <button id="start" class="go">Start</button>
  </header>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="msg">Object select karein aur Start button dabayein.</div>
    <div id="status" hidden></div>
  </div>
  <footer>
    <label><input type="checkbox" id="sound" checked> Sound Beep</label>
    <button id="flip">Flip Camera</button>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const CLASSES = ["person","bicycle","car","motorcycle","airplane","bus","train","truck","boat","traffic light","fire hydrant","stop sign","parking meter","bench","bird","cat","dog","horse","sheep","cow","elephant","bear","zebra","giraffe","backpack","umbrella","handbag","tie","suitcase","frisbee","skis","snowboard","sports ball","kite","baseball bat","baseball glove","skateboard","surfboard","tennis racket","bottle","wine glass","cup","fork","knife","spoon","bowl","banana","apple","sandwich","orange","broccoli","carrot","hot dog","pizza","donut","cake","chair","couch","potted plant","bed","dining table","toilet","tv","laptop","mouse","remote","keyboard","cell phone","microwave","oven","toaster","sink","refrigerator","book","clock","vase","scissors","teddy bear","hair drier","toothbrush"];

const $ = id => document.getElementById(id);
const video = $('video'), canvas =$('overlay'), ctx = canvas.getContext('2d');
const sel = $('target'), status =$('status'), msg = $('msg'), startBtn =$('start');

CLASSES.slice().sort().forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  sel.appendChild(o);
});
sel.value = 'cell phone';

let model = null, stream = null, running = false, facing = 'environment';
let lastBeep = 0, audioCtx = null;

function beep() {
  if (!$('sound').checked) return;
  const now = Date.now();
  if (now - lastBeep < 1000) return;
  lastBeep = now;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.value = 0.1;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.15);
  } catch (e) {}
}

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
  } catch (e) {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  }
  
  video.srcObject = stream;
  await video.play();

  if (facing === 'user') {
    video.classList.add('mirror');
    canvas.classList.add('mirror');
  } else {
    video.classList.remove('mirror');
    canvas.classList.remove('mirror');
  }
}

function mapBox([x, y, w, h]) {
  const vw = video.videoWidth, vh = video.videoHeight, cw = canvas.clientWidth, ch = canvas.clientHeight;
  const s = Math.max(cw / vw, ch / vh), ox = (vw * s - cw) / 2, oy = (vh * s - ch) / 2;
  return [x * s - ox, y * s - oy, w * s, h * s];
}

async function loop() {
  if (!running) return;
  if (video.readyState >= 2) {
    const preds = await model.detect(video, 10, 0.4);
    canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const target = sel.value;
    let found = false;

    for (const p of preds) {
      if (p.class === target) {
        found = true;
        const b = mapBox(p.bbox);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#3ee6b5';
        ctx.strokeRect(...b);
        
        ctx.fillStyle = '#3ee6b5';
        ctx.fillRect(b[0], Math.max(0, b[1] - 22), 120, 22);
        ctx.fillStyle = '#04281f';
        ctx.font = 'bold 13px system-ui';
        ctx.fillText(`${p.class} ${Math.round(p.score * 100)}%`, b[0] + 5, Math.max(15, b[1] - 6));
      }
    }

    status.hidden = false;
    if (found) {
      status.className = 'found';
      status.innerHTML = `<b>Mil gaya: ${target}</b>Saamne camera ke paas rakha hai.`;
      beep();
    } else {
      status.className = '';
      status.innerHTML = `<b>Dhundh raha hu: ${target}</b>Phone ko dheere-dheere ghumayein...`;
    }
  }
  requestAnimationFrame(loop);
}

function stop() {
  running = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  status.hidden = true; msg.hidden = false;
  msg.textContent = 'Stopped. Phir se scan karne ke liye Start dabayein.';
  startBtn.textContent = 'Start';
}

startBtn.onclick = async () => {
  if (running) return stop();
  try {
    msg.hidden = false;
    msg.textContent = 'AI Model load ho raha hai...';
    startBtn.disabled = true;
    if (!model) { await tf.ready(); model = await cocoSsd.load({ base: 'lite_mobilenet_v2' }); }
    await openCamera();
    msg.hidden = true; running = true; startBtn.textContent = 'Stop';
    loop();
  } catch (e) {
    msg.hidden = false;
    msg.textContent = 'Error: ' + e.message + '. Kripya camera permission check karein.';
  } finally { startBtn.disabled = false; }
};

$('flip').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  if (running) {
    try { await openCamera(); } catch (e) { msg.textContent = e.message; }
  }
};
</script>
</body>
</html>
